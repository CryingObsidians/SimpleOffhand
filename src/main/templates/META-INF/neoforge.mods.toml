# SimpleOffhand — mod metadata
# The dollar-brace placeholders below are substituted by the generateModMetadata task in build.gradle.
modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"
issueTrackerURL = "https://github.com/CryingObsidians/SimpleOffhand/issues"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL = "https://github.com/CryingObsidians/SimpleOffhand"
logoFile = "simpleoffhand.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Declare the mixin config so FML loads it.
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]] #optional
modId = "neoforge"
type = "required" #mandatory
versionRange = "${neo_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
